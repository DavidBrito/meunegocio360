# Infraestrutura local: PostgreSQL do Nucleo (um banco por servico, RNF-090).
# As variaveis vem do .env da raiz (copie de .env.example).
services:
  db-core:
    image: postgres:16-alpine
    container_name: meunegocio360-db-core
    environment:
      POSTGRES_DB: ${DB_NAME:-meunegocio360_core}
      POSTGRES_USER: ${DB_USER:-meunegocio360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - db-core-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-core-data:
